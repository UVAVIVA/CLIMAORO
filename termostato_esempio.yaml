# ============================================================
# FILE PRINCIPALE D'ESEMPIO - Termostato
# Include il package packages/termostato.yaml
# Copia questo file e modifica le substitution per ogni device
# ============================================================
substitutions:
  collettore_mac: "28:84:85:52:26:08"
  static_ip: "192.168.1.203"
  i2c_sda: "0"
  i2c_scl: "1"
  led_pin: "8"
  sht_address: "0x44"

  device_name: "termostato-c6-esempio"
  device_friendly: "Termostato Esempio"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly}
  project:
    name: UVAVIVA.CLIMA_ORO
    version: "BETA2026"

esp32:
  variant: Esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

wifi:
  networks:
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password2
      channel: 9
      manual_ip:
        static_ip: ${static_ip}
        gateway: 192.168.1.1
        subnet: 255.255.255.0
  reboot_timeout: 0s
  power_save_mode: NONE
  fast_connect: false

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome

logger:

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}

debug:
  update_interval: 1min

text_sensor:
  - platform: version
    name: "Versione Firmware"
  - platform: template
    name: "Stato Sistema"
    id: stato_sistema
    icon: "mdi:information-outline"
  - platform: template
    name: "Ultimo Errore"
    id: ultimo_errore
    icon: "mdi:alert-circle"
  - platform: template
    name: "Cronologia Errori"
    id: cronologia_errori
    icon: "mdi:format-list-bulleted"
    entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "Motivo Riavvio"
      icon: "mdi:restart-alert"
  - platform: template
    name: "Ultimo Messaggio ESP-NOW"
    id: ultimo_espnow
    icon: "mdi:message-receive-text"

packages:
  - !include packages/termostato.yaml
